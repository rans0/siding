<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.SHA}} · {{.T.Task}} · siding</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="ide" data-start="diff">
{{template "top"}}
<div class="trackbar"><span class="crumb">/ <a href="/t/{{.T.Task}}">{{.T.Task}}</a> / {{.Repo}} / <code>{{.SHA}}</code></span></div>
<div class="split-pane">
<nav class="side" aria-label="Files in this commit">
  <section><h2>Message</h2><button type="button" class="item" data-doc="d-msg" title="Commit message"><span class="name">Commit message</span></button></section>
  <section><h2>Files</h2>{{template "filelist" .Files}}</section>
  <p class="keys">j / k next, previous · s split</p>
</nav>
<main class="pane">
  <div class="panehead"><span id="title"></span><button type="button" class="diff-mode" aria-pressed="false" hidden>Split</button></div>
  <div id="view" class="view"></div>
</main>
</div>
<template id="d-msg"><pre class="doc">{{.Msg}}</pre></template>
{{template "viewer"}}
</body>
</html>
