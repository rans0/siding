<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<title>siding board</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><h1>siding</h1><span>{{.Root}}</span></header>
<main>
{{range .Columns}}
<section aria-label="{{.Name}}">
  <h2>{{.Name}} ({{len .Cards}})</h2>
  {{range .Cards}}
  <article class="card{{if .Gate}} gate{{end}}">
    <a href="/t/{{.Task}}"><div class="task">{{.Task}}{{if .Hotfix}} · hotfix{{end}}</div></a>
    <div class="stage">{{.Stage}}</div>
    <ul>
    {{range .Repos}}
      <li><code>{{.Name}}</code><span{{if .Clean}} class="clean"{{end}}>{{.Summary}}</span></li>
    {{end}}
    </ul>
  </article>
  {{else}}<p class="empty">none</p>{{end}}
</section>
{{end}}
</main>
</body>
</html>
