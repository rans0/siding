[defaults]
base = "origin/main"
port_stride = 100              # track N: every port + N*100 (v0.2)
retro_max = 5                  # max lesson proposals per task

# One section per repo in repos/. All keys optional.
# [repos.backend]
# base = "origin/develop"      # overrides defaults.base
# setup = "go mod download"
# env_ports = ["PORT=8080", "DB_PORT=5432"]

[required.tools]
# check verifies the Bash hook, not just the binary; --auto-patch because siding runs setup non-interactively
rtk = { check = "rtk init -g --show", expect = "Hook: rtk hook", setup = "rtk init -g --auto-patch" }

[required.skills]
brainstorm = { source = "github:obra/superpowers", path = "skills/brainstorming", ref = "v6.4.2", stages = ["plan"] }
ponytail   = { source = "github:DietrichGebert/ponytail", path = "skills/ponytail", ref = "v4.10.0", stages = ["build", "review"], claude_plugin = "ponytail@ponytail" }
